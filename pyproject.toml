[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nrai-protected-image"
version = "0.1.0"
description = "Prototype container and rights manifest for cooperative protected image handling"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
images = ["Pillow>=9"]
test = ["pytest>=7", "Pillow>=9"]
build-desktop = ["pyinstaller>=6", "Pillow>=9"]

[project.scripts]
nrai = "nrai.cli:main"
nrai-viewer = "nrai.viewer:main"
nrai-desktop = "nrai.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
