name: desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NRAI-macOS
            path: |
              dist/NRAI Creator.app
              dist/NRAI Viewer.app
          - os: windows-latest
            artifact: NRAI-Windows
            path: |
              dist/NRAI Creator
              dist/NRAI Viewer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install '.[build-desktop]'
      - run: python -m PyInstaller --noconfirm --clean --windowed --name "NRAI Creator" --paths src nrai_desktop.py
      - run: python -m PyInstaller --noconfirm --clean --windowed --name "NRAI Viewer" --paths src nrai_viewer_desktop.py
      - name: Register .nrai with the macOS viewer bundle
        if: runner.os == 'macOS'
        run: python scripts/register_macos_bundle.py "dist/NRAI Viewer.app"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
