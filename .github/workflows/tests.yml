name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q

  macos-preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          swiftc -swift-version 5 platform/macos/NRAIQuickLook/NRAIV1.swift
          platform/macos/NRAIQuickLook/ConformanceHarness.swift
          -o "$RUNNER_TEMP/nrai-v1-conformance"
      - run: >-
          "$RUNNER_TEMP/nrai-v1-conformance" tests/vectors/v1
      - run: >-
          swiftc -typecheck -swift-version 5 -framework AppKit
          -framework QuickLookThumbnailing
          platform/macos/NRAIQuickLook/NRAIV1.swift
          platform/macos/NRAIQuickLook/NRAIThumbnailProvider.swift
      - run: >-
          xcodebuild -project platform/macos/NRAIQuickLook/NRAIQuickLook.xcodeproj
          -scheme NRAIQuickLookExtension -configuration Release
          -derivedDataPath "$RUNNER_TEMP/nrai-quicklook"
          CODE_SIGNING_ALLOWED=NO build

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: dotnet build platform/windows/NraiThumbnailHandler.Tests/NraiThumbnailHandler.Tests.csproj --configuration Release
      - shell: pwsh
        run: '& "platform/windows/NraiThumbnailHandler.Tests/bin/Release/net48/NraiThumbnailHandler.Tests.exe" "tests/vectors/v1"'
